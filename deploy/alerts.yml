groups:
  - name: modelroute
    rules:
      - alert: FallbackRateHigh
        # Sustained fallback well above the ~35% seen in offline eval = drift or a bad deploy.
        expr: sum(rate(modelroute_requests_total{route="large"}[10m])) / sum(rate(modelroute_requests_total[10m])) > 0.6
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "More than 60% of traffic is falling back to the large model"
      - alert: P95LatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(modelroute_request_latency_seconds_bucket[5m]))) > 2
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "p95 classification latency above 2 s"
      - alert: LargeModelDegraded
        expr: rate(modelroute_fallbacks_total{reason="large_failed"}[5m]) > 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "Large model failing; router is serving small-model answers"
