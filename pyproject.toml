[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "modelroute"
version = "0.1.0"
description = "Smaller models. Bigger impact. Fine-tune a lightweight ticket classifier and route only the hard requests to a large LLM."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Navyashree Byregowda" }]
keywords = ["llm", "routing", "fine-tuning", "lora", "classification", "mlops"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "joblib>=1.3",
  "scikit-learn>=1.4",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "typer>=0.12",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "prometheus-client>=0.20",
  "httpx>=0.27",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
finetune = [
  "torch>=2.2",
  "transformers>=4.44",
  "peft>=0.12",
  "bitsandbytes>=0.43",
  "accelerate>=0.33",
  "datasets>=2.20",
]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
modelroute = "modelroute.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/modelroute"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
